name: CHUMA Server Handoff

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate release
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "psycopg[binary]>=3.2,<4" pytest pyyaml
          python -m compileall -q chuma_ip_factory run.py
          python -m pytest -q
          python -c "import yaml; yaml.safe_load(open('infra/compose.yml')); print('compose: OK')"
      - name: Confirm autonomous server update path
        run: |
          test -f infra/auto-update.sh
          test -f infra/chuma-auto-update.service
          echo "Release validated. Production server updates itself from main through CHUMA Auto Update Agent."
