name: CHUMA Deploy

on:
  workflow_dispatch:

concurrency:
  group: chuma-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          CHUMA_DEPLOY_PRIVATE_KEY: ${{ secrets.CHUMA_DEPLOY_PRIVATE_KEY }}
          CHUMA_DEPLOY_HOST: ${{ secrets.CHUMA_DEPLOY_HOST }}
        run: |
          test -n "$CHUMA_DEPLOY_PRIVATE_KEY"
          test -n "$CHUMA_DEPLOY_HOST"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$CHUMA_DEPLOY_PRIVATE_KEY" > ~/.ssh/chuma_deploy
          chmod 600 ~/.ssh/chuma_deploy
          ssh-keyscan -H "$CHUMA_DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Package source
        run: |
          tar --exclude-vcs --exclude='infra/.env' --exclude='infra/backups' -czf /tmp/chuma-release.tgz .

      - name: Upload release
        env:
          CHUMA_DEPLOY_HOST: ${{ secrets.CHUMA_DEPLOY_HOST }}
        run: |
          scp -i ~/.ssh/chuma_deploy /tmp/chuma-release.tgz "chuma-deploy@$CHUMA_DEPLOY_HOST:/tmp/chuma-release.tgz"

      - name: Deploy
        env:
          CHUMA_DEPLOY_HOST: ${{ secrets.CHUMA_DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/chuma_deploy "chuma-deploy@$CHUMA_DEPLOY_HOST" '
            set -eu
            test -f /opt/chuma/infra/.env
            rm -rf /opt/chuma/release
            mkdir -p /opt/chuma/release
            tar -xzf /tmp/chuma-release.tgz -C /opt/chuma/release
            cp /opt/chuma/infra/.env /opt/chuma/release/infra/.env
            cd /opt/chuma/release/infra
            docker compose --env-file .env -f compose.yml config -q
            docker compose --env-file .env -f compose.yml up -d --build
            docker compose --env-file .env -f compose.yml ps
          '
