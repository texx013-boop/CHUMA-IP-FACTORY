name: CHUMA IP FACTORY CI

on:
  push:
    branches: ["main", "feature/chuma-anywhere-workspace"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e . && pip install "psycopg[binary]>=3.2,<4" pytest
      - name: Compile
        run: python -m compileall -q chuma_ip_factory run.py
      - name: Test
        run: python -m pytest -q
      - name: Validate deployment manifests
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('render.yaml')); print('render.yaml: OK')"
          python -c "import yaml; yaml.safe_load(open('infra/compose.yml')); print('infra/compose.yml: YAML OK')"
          python -c "import yaml; yaml.safe_load(open('.github/workflows/deploy.yml')); print('deploy.yml: YAML OK')"
          docker compose config -q
          docker compose -f infra/compose.yml config -q
      - name: Docker build
        run: docker build -t chuma-ip-factory:ci .
      - name: Infrastructure syntax checks
        run: |
          bash -n infra/bootstrap.sh
          for f in infra/*.sh; do bash -n "$f"; done
          grep -q "manifest checksum verification failed" infra/chuma-release.sh
          grep -q "path traversal in bundle" infra/chuma-release.sh
          grep -q "secret-like file in bundle" infra/chuma-release.sh
          grep -q "links are not allowed in bundle" infra/chuma-release.sh
          grep -q "unexpected path in bundle" infra/chuma-release.sh
          ! grep -q 'source "$tmp/manifest.env"' infra/chuma-release.sh
          sh -n infra/backup.sh
          mkdir -p /opt/chuma/agent
          for script in chuma-agent.sh auto-update.sh chuma-watchdog.sh chuma-security-agent.sh chuma-control.sh chuma-workspace.sh chuma-intelligence.sh; do
            touch "/opt/chuma/agent/$script"
            chmod 755 "/opt/chuma/agent/$script"
          done
          for script in chuma-job-dispatcher.sh chuma-job-queue.sh chuma-capability-firewall.sh chuma-server-registry.sh chuma-task-language.sh chuma-operation-registry.sh chuma-owner-identity.sh chuma-approval-gate.sh; do
            touch "/opt/chuma/agent/$script"
            chmod 755 "/opt/chuma/agent/$script"
          done
          mkdir -p /opt/chuma/agent/executors
          for executor in SHUMA_SPACE FILM_COMBAIN PERSONAL_AI_COMPANION; do
            touch "/opt/chuma/agent/executors/$executor.sh"
            chmod 755 "/opt/chuma/agent/executors/$executor.sh"
          done
          mkdir -p /opt/chuma/infra
          touch /opt/chuma/infra/backup.sh
          chmod 755 /opt/chuma/infra/backup.sh
          for f in infra/*.service; do systemd-analyze verify "$f"; done
          test -f infra/chuma-backup.service
          test -f infra/chuma-backup.timer
          test -f infra/github-access.sh
          test -f infra/backup-verify.sh
          test -f infra/chuma-control.sh
          test -f infra/chuma-workspace.sh
          bash infra/test-chuma-workspace.sh
          bash infra/test-chuma-interaction-core.sh
          bash infra/test-chuma-goal-decision-recovery-core.sh
          bash infra/test-chuma-intelligence.sh
          test -f infra/chuma-control.service
          test -f infra/chuma-control.timer
          test -f infra/chuma-job-dispatcher.sh
          test -f infra/chuma-job-dispatcher.service
          bash -n infra/chuma-job-dispatcher.sh
          test -f infra/chuma-operation-registry.sh
          bash -n infra/chuma-operation-registry.sh
          bash infra/test-chuma-operation-layer.sh
          grep -q 'operation_not_allowed' infra/executors/SHUMA_SPACE.sh
          grep -q 'operation_not_allowed' infra/executors/FILM_COMBAIN.sh
          grep -q 'operation_not_allowed' infra/executors/PERSONAL_AI_COMPANION.sh
          ! grep -R -nE '(^|[[:space:]])(eval|sh[[:space:]]+-c|bash[[:space:]]+-c)[[:space:]]+["\$].*(task|TASK)' infra/executors infra/chuma-job-dispatcher.sh
          grep -q '/api/operations' infra/chuma-control-api.py
          grep -q "retry()" infra/chuma-job-queue.sh
          grep -q "max_attempts=2" infra/chuma-job-queue.sh
          grep -q "job_retrying" infra/chuma-job-dispatcher.sh
          grep -q "stale_job_timeout" infra/chuma-job-dispatcher.sh
          grep -q "job_recovered" infra/chuma-job-dispatcher.sh
          grep -q "task_status=.*tr" infra/chuma-job-queue.sh
          for executor in SHUMA_SPACE FILM_COMBAIN PERSONAL_AI_COMPANION; do
            test -f "infra/executors/$executor.sh"
            bash -n "infra/executors/$executor.sh"
          done
                    test -f infra/chuma-owner-identity.sh
          test -f infra/chuma-approval-gate.sh
          bash -n infra/chuma-owner-identity.sh
          bash -n infra/chuma-approval-gate.sh
          grep -q '/api/events' infra/chuma-control-api.py
          grep -q '/api/capabilities' infra/chuma-control-api.py
          grep -q 'chuma-approval-gate.sh' infra/chuma-control-api.py
          test -f infra/chuma-release.sh
          grep -q 'CHUMA project registry' infra/chuma-control.sh
          grep -q 'health) health' infra/chuma-control.sh
          grep -q 'release) release' infra/chuma-control.sh
          grep -q 'chuma-release.sh' infra/agent-install.sh
          grep -q 'chuma-workspace.sh' infra/agent-install.sh
          grep -q 'workspace)' infra/chuma-control.sh
          grep -q 'intelligence)' infra/chuma-control.sh
          grep -q 'chuma-intelligence.sh' infra/agent-install.sh
          grep -q 'app.health=ok' infra/chuma-control.sh
          grep -q 'systemctl enable --now chuma-backup.timer chuma-control.timer' infra/agent-install.sh
          grep -q 'sha256sum "\$FILE" > "\$FILE.sha256"' infra/backup.sh
          grep -q 'sha256sum -c "\$checksum"' infra/backup-verify.sh
          grep -q 'gzip -t "\$latest"' infra/backup-verify.sh
          grep -q 'auth_rate_limited' chuma_ip_factory/api.py
          grep -q 'Retry-After' chuma_ip_factory/api.py
          grep -q 'CHUMA_ALLOW_ANONYMOUS_AUTH' chuma_ip_factory/api.py
          grep -q 'return False' chuma_ip_factory/api.py
          grep -q 'asset_path_forbidden' chuma_ip_factory/core.py
          grep -q 'tmp.replace(path)' chuma_ip_factory/core.py
          grep -q 'chuma-agent.service chuma-auto-update.service chuma-watchdog.service chuma-security-agent.service' infra/agent-install.sh
          grep -q 'systemctl enable --now chuma-backup.timer' infra/agent-install.sh
          for unit in chuma-agent.service chuma-auto-update.service chuma-watchdog.service chuma-security-agent.service chuma-backup.service chuma-backup.timer; do
            test -f "infra/$unit"
          done
          grep -q "git@github.com:texx013-boop/CHUMA-IP-FACTORY.git" infra/auto-update.sh
          grep -q 'git -C "\$TMP/repo" archive --format=tar HEAD' infra/auto-update.sh
          grep -q 'release archive fallback succeeded' infra/auto-update.sh
          grep -q 'release archive fallback failed' infra/auto-update.sh
          grep -q 'http://127.0.0.1/ready' infra/auto-update.sh
          grep -q 'http://127.0.0.1/ready' infra/agent-verify.sh
          grep -q 'agent refresh failed; deployment is not accepted' infra/auto-update.sh
          grep -q 'process_handoff()' infra/auto-update.sh
          grep -q 'ci_green()' infra/auto-update.sh
          grep -q 'required GitHub validation is not green' infra/auto-update.sh
          grep -q 'local release handoff detected' infra/auto-update.sh
          grep -q 'local release deployment successful' infra/auto-update.sh
          grep -q 'previous release restored after local handoff failure' infra/auto-update.sh
          grep -q 'previous release restored and healthy' infra/auto-update.sh
          grep -q 'agent-install.sh' infra/auto-update.sh
          test ! -f infra/.env
          test ! -f infra/backups/.env
          for pattern in 'reverse_proxy' 'request_body' 'max_size 32MB' 'X-Content-Type-Options' 'X-Frame-Options' 'CHUMA_UPSTREAM'; do
            grep -Fq "$pattern" infra/Caddyfile || { echo "Caddyfile contract missing: $pattern"; exit 1; }
          done
      - name: Remote control agent syntax
        run: bash infra/test-chuma-control-api.sh

      - name: Release handoff integration test
        run: bash infra/test-chuma-release-handoff.sh

      - name: Docker build security check
        run: |
          test -f infra/.gitignore
          grep -q "USER chuma" Dockerfile
