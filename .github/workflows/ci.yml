name: CHUMA IP FACTORY CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e . && pip install "psycopg[binary]>=3.2,<4" pytest
      - name: Compile
        run: python -m compileall -q chuma_ip_factory run.py
      - name: Test
        run: python -m pytest -q
      - name: Validate deployment manifests
        run: |
          python -m pip install pyyaml
          python -c "import yaml; yaml.safe_load(open('render.yaml')); print('render.yaml: OK')"
          python -c "import yaml; yaml.safe_load(open('infra/compose.yml')); print('infra/compose.yml: YAML OK')"
          docker compose config -q
          docker compose -f infra/compose.yml config -q
      - name: Docker build
        run: docker build -t chuma-ip-factory:ci .
      - name: Docker build security check
        run: |
          test -f infra/.gitignore
          test ! -f infra/.env
          grep -q "USER chuma" Dockerfile
