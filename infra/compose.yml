name: chuma-platform

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CHUMA_DOMAIN: ${CHUMA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chuma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CHUMA_HOST: 0.0.0.0
      PORT: 8097
      CHUMA_DATA_DIR: /data
      CHUMA_MEDIA_DIR: /data/media
      CHUMA_ADMIN_TOKEN: ${CHUMA_ADMIN_TOKEN}
      CHUMA_SPEND_MODE: ${CHUMA_SPEND_MODE}
      CHUMA_ALLOW_PAID_GENERATION: ${CHUMA_ALLOW_PAID_GENERATION}
      CHUMA_MONTHLY_SOFT_CAP_USD: ${CHUMA_MONTHLY_SOFT_CAP_USD}
      CHUMA_MONTHLY_HARD_CAP_USD: ${CHUMA_MONTHLY_HARD_CAP_USD}
    expose:
      - "8097"
    volumes:
      - chuma_appdata:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - edge
      - backend

volumes:
  caddy_data:
  caddy_config:
  chuma_pgdata:
  chuma_appdata:

networks:
  edge:
    name: chuma_edge
  backend:
    name: chuma_backend
    internal: true
